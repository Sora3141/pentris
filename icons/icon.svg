<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="256" cy="200" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#131a30"/>
      <stop offset="1" stop-color="#070912"/>
    </radialGradient>
    <radialGradient id="glow" cx="256" cy="270" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fc4e6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2fc4e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="piece" x1="0" y1="151" x2="0" y2="361" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fe6f5"/>
      <stop offset="1" stop-color="#159fc2"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="270" r="230" fill="url(#glow)"/>

  <!-- HUD hint: NEXT bar + HOLD swatch, like the game's top strip -->
  <rect x="150" y="95" width="110" height="18" rx="9" fill="#aab4d6" opacity="0.85"/>
  <rect x="330" y="110" width="40" height="40" rx="8" fill="#c069ff"/>

  <!-- the pentomino: one connected flat shape, outer outline only, no cell grid -->
  <g filter="url(#shadow)">
    <path d="M186 151 L326 151 L326 291 L256 291 L256 361 L186 361 Z"
          fill="url(#piece)" stroke="#0b4a5e" stroke-width="11" stroke-linejoin="round"/>
    <path d="M197 165 L314 165" stroke="#fff" stroke-opacity="0.28" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
